name: Check Flutter common app
on:
  push:
    branches: [app]
    paths: ['apps/**', 'packages/**', 'specs/**', 'src/**', 'cloudflare/d1/**', 'scripts/*flutter*', 'tests/flutter*', 'tests/helpers/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/flutter.yml']
  pull_request:
    branches: [app]
    paths: ['apps/**', 'packages/**', 'specs/**', 'src/**', 'cloudflare/d1/**', 'scripts/*flutter*', 'tests/flutter*', 'tests/helpers/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/flutter.yml']
permissions:
  contents: read
jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: dart pub get && dart analyze && dart test
        working-directory: packages/xingji_core
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-flutter-renderer.mjs --check
      - run: node --test tests/flutter-github-interop.mjs tests/flutter-d1-interop.mjs
      - run: flutter pub get
        working-directory: apps/flutter
      - run: flutter analyze
        working-directory: apps/flutter
      - run: flutter test
        working-directory: apps/flutter
      - run: flutter build web --release
        working-directory: apps/flutter
  native-renderer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/flutter
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: |
          $env:LIBQUICKJSC_TEST_PATH=(Resolve-Path -LiteralPath 'build/windows/x64/runner/Release/quickjs_c_bridge_plugin.dll').Path
          flutter test test/native_renderer_test.dart
