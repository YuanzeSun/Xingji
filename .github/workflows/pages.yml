name: Publish Xingji Pages
run-name: Publish Xingji Pages (${{ inputs.version }})
on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择上线版本'
        type: choice
        required: true
        default: web
        options:
          - web
          - flutter
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: ${{ inputs.version == 'web' && format('Web {0}/{1}', matrix.shard, strategy.job-total) || 'Build Flutter' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ fromJSON(inputs.version == 'web' && '[1, 2, 3]' || '[1]') }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.version == 'flutter' && 'refs/heads/app' || github.sha }}
      - uses: actions/configure-pages@v5
        if: inputs.version == 'flutter'
        id: pages

      - uses: pnpm/action-setup@v4
        if: inputs.version == 'web'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: inputs.version == 'web'
        with:
          node-version: 24
          cache: pnpm
      - name: Install Web dependencies
        if: inputs.version == 'web'
        run: pnpm install --frozen-lockfile
      - name: Test Web
        if: inputs.version == 'web'
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm test
      - name: Build Web site
        if: inputs.version == 'web' && matrix.shard == 1
        run: pnpm build

      - uses: subosito/flutter-action@v2
        if: inputs.version == 'flutter'
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Build Flutter preview
        if: inputs.version == 'flutter'
        working-directory: apps/flutter
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          flutter pub get
          flutter build web --release --base-href "${PAGES_BASE_PATH%/}/"

      - uses: actions/upload-pages-artifact@v3
        if: matrix.shard == 1
        with:
          path: ${{ inputs.version == 'flutter' && 'apps/flutter/build/web' || 'dist' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
